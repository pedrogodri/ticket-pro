# payment-service: internal only (no published ports). Included by the root docker-compose.yml.
services:
  payment-service:
    build: .
    env_file: .env.example
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  backend:
    name: ticketpro-backend
