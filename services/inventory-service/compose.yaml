# inventory-service + its own database (ADR-0004, ADR-0020). Included by the root docker-compose.yml.
# The database lives only on ticketpro-inventory-service-data: no other service can reach it.
services:
  inventory-service:
    build: .
    deploy:
      replicas: 2
    env_file: .env.example
    # Saga timing shared with order-service (arquitetura §6 step 9): the root .env sets one value for both;
    # standalone (`make run`) falls back to the RFC 0003 defaults.
    environment:
      ORDER_PAYMENT_TIMEOUT_MS: ${ORDER_PAYMENT_TIMEOUT_MS:-15000}
      RESERVATION_SAFETY_MARGIN_MS: ${RESERVATION_SAFETY_MARGIN_MS:-30000}
      RESERVATION_TTL_MS: ${RESERVATION_TTL_MS:-60000}
    networks: [backend, inventory-service-data]
    depends_on:
      inventory-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  inventory-service-migrate:
    image: flyway/flyway:13.11.1-alpine
    command: migrate
    env_file: db.env.example
    volumes:
      - ./migrations:/flyway/sql:ro
    networks: [inventory-service-data]
    depends_on:
      inventory-db:
        condition: service_healthy

  inventory-db:
    image: postgres:16-alpine
    env_file: db.env.example
    volumes:
      - inventory-data:/var/lib/postgresql/data
    networks: [inventory-service-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_owner -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  backend:
    name: ticketpro-backend
  inventory-service-data:
    name: ticketpro-inventory-service-data
    internal: true

volumes:
  inventory-data:
