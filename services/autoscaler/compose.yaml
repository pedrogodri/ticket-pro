# autoscaler: internal only (no published ports). Included by the root docker-compose.yml.
services:
  autoscaler:
    build: .
    env_file: .env.example
    networks: [backend]
    # ADR-0015: the Docker socket lets it start and stop replicas. It gives full control of the local
    # Docker host, accepted for the demo only; root is needed to open the socket.
    user: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/autoscaler", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  backend:
    name: ticketpro-backend
