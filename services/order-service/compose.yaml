# order-service + its own database (ADR-0004, ADR-0020). Included by the root docker-compose.yml.
# The database lives only on ticketpro-order-service-data: no other service can reach it.
services:
  order-service:
    build: .
    deploy:
      replicas: 2
    env_file: .env.example
    # Saga timing shared with inventory-service (arquitetura §6 step 9): the root .env sets one value for both;
    # standalone (`make run`) falls back to the RFC 0003 defaults.
    environment:
      ORDER_PAYMENT_TIMEOUT_MS: ${ORDER_PAYMENT_TIMEOUT_MS:-15000}
      RESERVATION_SAFETY_MARGIN_MS: ${RESERVATION_SAFETY_MARGIN_MS:-30000}
      RESERVATION_TTL_MS: ${RESERVATION_TTL_MS:-60000}
      # Versioning demo (RFC 0001 §5.5): `ORDER_CREATED_VERSION=1 docker compose up -d order-service`.
      ORDER_CREATED_VERSION: ${ORDER_CREATED_VERSION:-2}
    networks: [backend, order-service-data]
    depends_on:
      order-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  order-service-migrate:
    image: flyway/flyway:13.11.1-alpine
    command: migrate
    env_file: db.env.example
    volumes:
      - ./migrations:/flyway/sql:ro
    networks: [order-service-data]
    depends_on:
      orders-db:
        condition: service_healthy

  orders-db:
    image: postgres:16-alpine
    env_file: db.env.example
    volumes:
      - orders-data:/var/lib/postgresql/data
    networks: [order-service-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_owner -d orders"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  backend:
    name: ticketpro-backend
  order-service-data:
    name: ticketpro-order-service-data
    internal: true

volumes:
  orders-data:
