# user-service + its own database (ADR-0004, ADR-0020). Included by the root docker-compose.yml.
# The database lives only on ticketpro-user-service-data: no other service can reach it.
services:
  user-service:
    build: .
    env_file: .env.example
    networks: [backend, user-service-data]
    depends_on:
      user-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  user-service-migrate:
    image: flyway/flyway:13.11.1-alpine
    command: migrate
    env_file: db.env.example
    volumes:
      - ./migrations:/flyway/sql:ro
    networks: [user-service-data]
    depends_on:
      users-db:
        condition: service_healthy

  users-db:
    image: postgres:16-alpine
    env_file: db.env.example
    volumes:
      - users-data:/var/lib/postgresql/data
    networks: [user-service-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_owner -d users"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  backend:
    name: ticketpro-backend
  user-service-data:
    name: ticketpro-user-service-data
    internal: true

volumes:
  users-data:
