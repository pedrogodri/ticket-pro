    x-service: payment-service
  orderReceivesPaymentApprovedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-payments"
    summary: "order-service consome PaymentApproved v1."
    messages:
      - "$ref": "#/channels/ticketpro-payments/messages/PaymentApprovedV1"
    x-service: order-service
    x-queue: ticketpro-order-service
    x-dlq: ticketpro-order-service-dlq
  publishPaymentFailedV1:
