    x-service: inventory-service
  orderReceivesInventoryReservationExpiredV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-inventory"
    summary: "order-service consome InventoryReservationExpired v1."
    messages:
      - "$ref": "#/channels/ticketpro-inventory/messages/InventoryReservationExpiredV1"
    x-service: order-service
    x-queue: ticketpro-order-service
    x-dlq: ticketpro-order-service-dlq
  publishTicketsIssuedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-inventory"
    summary: "inventory-service publica TicketsIssued v1 via outbox."
    messages:
