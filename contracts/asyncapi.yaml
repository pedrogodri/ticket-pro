components:
  messages:
    UserRegisteredV1:
      name: UserRegistered
      title: "UserRegistered v1"
      summary: "Credencial criada no auth-service; o user-service cria o perfil."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/UserRegistered/v1.schema.json
      x-version: 1
    TokenRevokedV1:
      name: TokenRevoked
      title: "TokenRevoked v1"
      summary: "Access token revogado; o gateway copia o jti para sua blacklist até expiresAt."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/TokenRevoked/v1.schema.json
      x-version: 1
    UserCreationFailedV1:
      name: UserCreationFailed
      title: "UserCreationFailed v1"
      summary: "Perfil não pôde ser criado; o auth-service compensa removendo a credencial."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/UserCreationFailed/v1.schema.json
      x-version: 1
    OrderCreatedV1:
      name: OrderCreated
      title: "OrderCreated v1"
      summary: "Pedido aceito (202) e pendente; inicia a saga pedindo reserva ao inventory."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/OrderCreated/v1.schema.json
      x-version: 1
    OrderCreatedV2:
      name: OrderCreated
      title: "OrderCreated v2"
      summary: "v2 adiciona o campo obrigatório channel (origem da compra). Consumidores aceitam v1 via upcaster (channel = API)."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/OrderCreated/v2.schema.json
      x-version: 2
    PaymentRequestedV1:
      name: PaymentRequested
      title: "PaymentRequested v1"
      summary: "Comando do orquestrador para cobrar o pedido reservado."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/PaymentRequested/v1.schema.json
      x-version: 1
    OrderConfirmedV1:
      name: OrderConfirmed
      title: "OrderConfirmed v1"
      summary: "Pagamento aprovado dentro do prazo; o inventory emite os ingressos e o user registra a compra."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/OrderConfirmed/v1.schema.json
      x-version: 1
    OrderCancelledV1:
      name: OrderCancelled
      title: "OrderCancelled v1"
      summary: "Pedido cancelado; o inventory libera a reserva (compensação) e o notification registra a falha."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/OrderCancelled/v1.schema.json
      x-version: 1
    RefundRequestedV1:
      name: RefundRequested
      title: "RefundRequested v1"
      summary: "Comando de estorno para aprovação que chegou após o cancelamento do pedido."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/RefundRequested/v1.schema.json
      x-version: 1
    InventoryReservedV1:
      name: InventoryReserved
      title: "InventoryReserved v1"
      summary: "Estoque reservado até expiresAt; informa o preço (fonte da verdade é o inventory)."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/InventoryReserved/v1.schema.json
      x-version: 1
    InventoryRejectedV1:
      name: InventoryRejected
      title: "InventoryRejected v1"
      summary: "Reserva negada; o pedido é cancelado sem compensação."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/InventoryRejected/v1.schema.json
      x-version: 1
    InventoryReservationExpiredV1:
      name: InventoryReservationExpired
      title: "InventoryReservationExpired v1"
      summary: "Reserva pendente expirou e o estoque foi devolvido; o order cancela se ainda não estiver em estado final."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/InventoryReservationExpired/v1.schema.json
      x-version: 1
    TicketsIssuedV1:
      name: TicketsIssued
      title: "TicketsIssued v1"
      summary: "Ingressos emitidos (um código por unidade); alimenta 'meus ingressos' (CQRS) e o comprovante no S3."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/TicketsIssued/v1.schema.json
      x-version: 1
    PaymentApprovedV1:
      name: PaymentApproved
      title: "PaymentApproved v1"
      summary: "Provedor aprovou a cobrança (pode chegar após o deadline do pedido — ver RFC 0003)."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/PaymentApproved/v1.schema.json
      x-version: 1
    PaymentFailedV1:
      name: PaymentFailed
      title: "PaymentFailed v1"
      summary: "Cobrança recusada, com erro ou timeout do provedor; dispara a compensação."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/PaymentFailed/v1.schema.json
      x-version: 1
    PaymentRefundedV1:
      name: PaymentRefunded
      title: "PaymentRefunded v1"
      summary: "Estorno concluído para uma aprovação tardia."
      contentType: application/json
      headers:
        "$ref": "#/components/schemas/MessageAttributes"
      payload:
        schemaFormat: "application/schema+json;version=draft-07"
        schema:
          "$ref": ./events/PaymentRefunded/v1.schema.json
      x-version: 1
  schemas:
    MessageAttributes:
      type: object
      description: "Atributos SNS/SQS (DataType=String) duplicados do envelope para filter policy e tracing."
      required:
        - type
        - version
        - correlationId
      properties:
        type:
          type: string
        version:
          type: string
          pattern: "^[1-9][0-9]*$"
        correlationId:
          type: string
          format: uuid
        traceparent:
          type: string
          description: "W3C Trace Context."
