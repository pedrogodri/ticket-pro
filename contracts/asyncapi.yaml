    x-service: order-service
  inventoryReceivesOrderCreatedV2:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "inventory-service consome OrderCreated v2."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderCreatedV2"
    x-service: inventory-service
    x-queue: ticketpro-inventory-service
    x-dlq: ticketpro-inventory-service-dlq
  publishPaymentRequestedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "order-service publica PaymentRequested v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/PaymentRequestedV1"
    x-service: order-service
  paymentReceivesPaymentRequestedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "payment-service consome PaymentRequested v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/PaymentRequestedV1"
    x-service: payment-service
    x-queue: ticketpro-payment-service
    x-dlq: ticketpro-payment-service-dlq
  publishOrderConfirmedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "order-service publica OrderConfirmed v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderConfirmedV1"
    x-service: order-service
  inventoryReceivesOrderConfirmedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "inventory-service consome OrderConfirmed v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderConfirmedV1"
    x-service: inventory-service
    x-queue: ticketpro-inventory-service
    x-dlq: ticketpro-inventory-service-dlq
  userReceivesOrderConfirmedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "user-service consome OrderConfirmed v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderConfirmedV1"
    x-service: user-service
    x-queue: ticketpro-user-service
    x-dlq: ticketpro-user-service-dlq
  publishOrderCancelledV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "order-service publica OrderCancelled v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderCancelledV1"
    x-service: order-service
  inventoryReceivesOrderCancelledV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "inventory-service consome OrderCancelled v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderCancelledV1"
    x-service: inventory-service
    x-queue: ticketpro-inventory-service
    x-dlq: ticketpro-inventory-service-dlq
  notificationReceivesOrderCancelledV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "notification-service consome OrderCancelled v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderCancelledV1"
    x-service: notification-service
    x-queue: ticketpro-notification-service
    x-dlq: ticketpro-notification-service-dlq
  publishRefundRequestedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "order-service publica RefundRequested v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/RefundRequestedV1"
    x-service: order-service
  paymentReceivesRefundRequestedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "payment-service consome RefundRequested v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/RefundRequestedV1"
    x-service: payment-service
    x-queue: ticketpro-payment-service
    x-dlq: ticketpro-payment-service-dlq
  publishInventoryReservedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-inventory"
    summary: "inventory-service publica InventoryReserved v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-inventory/messages/InventoryReservedV1"
    x-service: inventory-service
  orderReceivesInventoryReservedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-inventory"
    summary: "order-service consome InventoryReserved v1."
    messages:
      - "$ref": "#/channels/ticketpro-inventory/messages/InventoryReservedV1"
    x-service: order-service
    x-queue: ticketpro-order-service
