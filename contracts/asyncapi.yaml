# Catálogo AsyncAPI. Mantenha em sincronia com contracts/events/** no mesmo PR (RFC 0001 §7).
asyncapi: "3.1.0"
info:
  title: "Ticket Pro — eventos de domínio"
  version: "1.0.0"
  description: "Catálogo de eventos do Ticket Pro. Cada tópico SNS é um canal; cada serviço consumidor tem uma fila SQS própria (ticketpro-<serviço>) com DLQ, assinada por filter policy no atributo type. Fonte da verdade dos payloads: contracts/events/<Type>/v<N>.schema.json (RFC 0001)."
defaultContentType: application/json
servers:
  ministack:
    host: "ministack:4566"
    protocol: sns
    description: "MiniStack (AWS emulada). Endpoint configurado por AWS_ENDPOINT_URL."
channels:
  ticketpro-auth:
    address: ticketpro-auth
    description: "Tópico SNS ticketpro-auth."
    messages:
      UserRegisteredV1:
        "$ref": "#/components/messages/UserRegisteredV1"
      TokenRevokedV1:
        "$ref": "#/components/messages/TokenRevokedV1"
  ticketpro-users:
    address: ticketpro-users
    description: "Tópico SNS ticketpro-users."
    messages:
      UserCreationFailedV1:
        "$ref": "#/components/messages/UserCreationFailedV1"
  ticketpro-orders:
    address: ticketpro-orders
    description: "Tópico SNS ticketpro-orders."
    messages:
      OrderCreatedV1:
        "$ref": "#/components/messages/OrderCreatedV1"
      OrderCreatedV2:
        "$ref": "#/components/messages/OrderCreatedV2"
      PaymentRequestedV1:
        "$ref": "#/components/messages/PaymentRequestedV1"
      OrderConfirmedV1:
        "$ref": "#/components/messages/OrderConfirmedV1"
      OrderCancelledV1:
        "$ref": "#/components/messages/OrderCancelledV1"
      RefundRequestedV1:
        "$ref": "#/components/messages/RefundRequestedV1"
  ticketpro-inventory:
    address: ticketpro-inventory
    description: "Tópico SNS ticketpro-inventory."
    messages:
      InventoryReservedV1:
        "$ref": "#/components/messages/InventoryReservedV1"
      InventoryRejectedV1:
        "$ref": "#/components/messages/InventoryRejectedV1"
      InventoryReservationExpiredV1:
        "$ref": "#/components/messages/InventoryReservationExpiredV1"
      TicketsIssuedV1:
        "$ref": "#/components/messages/TicketsIssuedV1"
  ticketpro-payments:
    address: ticketpro-payments
    description: "Tópico SNS ticketpro-payments."
    messages:
      PaymentApprovedV1:
        "$ref": "#/components/messages/PaymentApprovedV1"
      PaymentFailedV1:
        "$ref": "#/components/messages/PaymentFailedV1"
      PaymentRefundedV1:
        "$ref": "#/components/messages/PaymentRefundedV1"
operations:
  publishUserRegisteredV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-auth"
    summary: "auth-service publica UserRegistered v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-auth/messages/UserRegisteredV1"
    x-service: auth-service
  userReceivesUserRegisteredV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-auth"
    summary: "user-service consome UserRegistered v1."
    messages:
      - "$ref": "#/channels/ticketpro-auth/messages/UserRegisteredV1"
    x-service: user-service
    x-queue: ticketpro-user-service
    x-dlq: ticketpro-user-service-dlq
  publishTokenRevokedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-auth"
    summary: "auth-service publica TokenRevoked v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-auth/messages/TokenRevokedV1"
    x-service: auth-service
  gatewayReceivesTokenRevokedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-auth"
    summary: "gateway consome TokenRevoked v1."
    messages:
      - "$ref": "#/channels/ticketpro-auth/messages/TokenRevokedV1"
    x-service: gateway
    x-queue: ticketpro-gateway
    x-dlq: ticketpro-gateway-dlq
  publishUserCreationFailedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-users"
    summary: "user-service publica UserCreationFailed v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-users/messages/UserCreationFailedV1"
    x-service: user-service
  authReceivesUserCreationFailedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-users"
    summary: "auth-service consome UserCreationFailed v1."
    messages:
      - "$ref": "#/channels/ticketpro-users/messages/UserCreationFailedV1"
    x-service: auth-service
    x-queue: ticketpro-auth-service
    x-dlq: ticketpro-auth-service-dlq
  publishOrderCreatedV1:
    action: send
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "order-service publica OrderCreated v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderCreatedV1"
    x-service: order-service
  inventoryReceivesOrderCreatedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-orders"
    summary: "inventory-service consome OrderCreated v1."
    messages:
      - "$ref": "#/channels/ticketpro-orders/messages/OrderCreatedV1"
    x-service: inventory-service
    x-queue: ticketpro-inventory-service
    x-dlq: ticketpro-inventory-service-dlq
  publishOrderCreatedV2:
