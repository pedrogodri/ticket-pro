    channel:
      "$ref": "#/channels/ticketpro-payments"
    summary: "payment-service publica PaymentFailed v1 via outbox."
    messages:
      - "$ref": "#/channels/ticketpro-payments/messages/PaymentFailedV1"
    x-service: payment-service
  orderReceivesPaymentFailedV1:
    action: receive
    channel:
      "$ref": "#/channels/ticketpro-payments"
    summary: "order-service consome PaymentFailed v1."
    messages:
      - "$ref": "#/channels/ticketpro-payments/messages/PaymentFailedV1"
    x-service: order-service
