name: notification-service

on:
  push:
    branches: [main]
    paths: ["services/notification-service/**", ".github/workflows/notification-service.yml"]
  pull_request:
    paths: ["services/notification-service/**", ".github/workflows/notification-service.yml"]

defaults:
  run:
    working-directory: services/notification-service

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/notification-service/go.mod
      - run: make lint typecheck test
      - run: docker build .
