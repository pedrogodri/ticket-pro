name: root

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and port exposure
        run: |
          cp .env.example .env
          docker compose config -q
          scripts/check-ports.sh
      - name: Terraform fmt
        run: docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf hashicorp/terraform:1.16.7 fmt -check -recursive
