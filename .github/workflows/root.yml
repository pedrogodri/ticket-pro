name: root

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck

  shared-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test the sync script
        run: scripts/tests/sync-shared.test.sh
      - name: Platform DDL has not drifted (migrations and fixtures)
        run: scripts/check-platform-ddl.sh
      - name: Test the Java platform drift check
        run: scripts/tests/check-java-platform.test.sh
      - name: Java platform copies have not drifted (ADR-0022)
        run: scripts/check-java-platform.sh
      - name: Vendored copies match their sources (ADR-0017)
        run: scripts/sync-shared.sh --check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and port exposure
        run: |
          cp .env.example .env
          docker compose config -q
          scripts/check-ports.sh
      - name: Terraform fmt
        run: docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf hashicorp/terraform:1.16.7 fmt -check -recursive
