name: inventory-service

on:
  push:
    branches: [main]
    paths: ["services/inventory-service/**", ".github/workflows/inventory-service.yml"]
  pull_request:
    paths: ["services/inventory-service/**", ".github/workflows/inventory-service.yml"]

defaults:
  run:
    working-directory: services/inventory-service

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: code
        name: Detect source code (the services are implemented by their owners)
        run: |
          if [ -d src ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::no src/ yet, skipping"; fi
      - uses: actions/setup-java@v4
        if: steps.code.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: steps.code.outputs.present == 'true'
        run: make lint typecheck test
      - name: Integration tests (Testcontainers, Postgres + MiniStack)
        if: steps.code.outputs.present == 'true'
        run: make test-integration
      - if: steps.code.outputs.present == 'true'
        run: docker build .
