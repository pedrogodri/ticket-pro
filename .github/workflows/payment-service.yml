name: payment-service

on:
  push:
    branches: [main]
    paths: ["services/payment-service/**", ".github/workflows/payment-service.yml"]
  pull_request:
    paths: ["services/payment-service/**", ".github/workflows/payment-service.yml"]

defaults:
  run:
    working-directory: services/payment-service

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: code
        name: Detect source code (the services are implemented by their owners)
        run: |
          if [ -d src ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::no src/ yet, skipping"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.code.outputs.present == 'true'
        with:
          dotnet-version: "10.0.x"
      - if: steps.code.outputs.present == 'true'
        run: make lint typecheck test
      - if: steps.code.outputs.present == 'true'
        run: docker build .
